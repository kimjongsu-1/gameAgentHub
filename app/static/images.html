<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 관리 · 게임 제작 통합 허브</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/images.css">
</head>
<body>
  <main class="image-library-page">
    <header>
      <div>
        <p class="eyebrow">VISUAL ASSET LIBRARY</p>
        <h1>이미지 관리</h1>
        <p class="subtitle">제작 이미지, 애니메이션 미리보기, 로컬 QA 결과를 큰 화면으로 확인합니다.</p>
      </div>
      <div class="header-actions">
        <a class="nav-link" href="/">통합 허브로 돌아가기</a>
        <span id="library-count" class="health">불러오는 중</span>
      </div>
    </header>

    <section class="panel library-toolbar" aria-label="이미지 필터">
      <label class="search-field">
        <span>검색</span>
        <input id="image-search" type="search" placeholder="파일명, 에셋 ID, 경로 검색">
      </label>
      <label>
        <span>종류</span>
        <select id="category-filter">
          <option value="all">전체 종류</option>
          <option value="character">캐릭터</option>
          <option value="monster">몬스터</option>
          <option value="background">맵·배경</option>
          <option value="vfx">이펙트</option>
          <option value="item">아이템</option>
          <option value="qa">QA·미리보기</option>
          <option value="other">기타</option>
        </select>
      </label>
      <label>
        <span>상태</span>
        <select id="status-filter">
          <option value="all">전체 상태</option>
          <option value="QA_PASS">QA 통과</option>
          <option value="APPROVED">승인 완료</option>
          <option value="PENDING">승인 대기</option>
          <option value="unregistered">미등록 파일</option>
        </select>
      </label>
      <label class="source-toggle">
        <input id="source-toggle" type="checkbox">
        <span>원본·중간 파일 포함</span>
      </label>
    </section>

    <section class="library-result-bar">
      <strong id="result-count">0개</strong>
      <span id="library-message" class="subtitle">이미지를 찾고 있습니다.</span>
    </section>
    <section id="image-grid" class="image-grid" aria-live="polite"></section>
  </main>

  <div id="image-lightbox" class="image-lightbox" hidden>
    <button id="lightbox-backdrop" class="lightbox-backdrop" aria-label="확대 보기 닫기"></button>
    <section class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button id="lightbox-close" class="lightbox-close" aria-label="확대 보기 닫기">×</button>
      <div class="lightbox-stage"><img id="lightbox-image" alt="선택한 이미지 확대 보기"></div>
      <div class="lightbox-info">
        <div>
          <p class="eyebrow">SELECTED ASSET</p>
          <h2 id="lightbox-title"></h2>
          <p id="lightbox-path" class="subtitle path-text"></p>
        </div>
        <div id="lightbox-meta" class="lightbox-meta"></div>
        <button id="copy-path" type="button">경로 복사</button>
      </div>
    </section>
  </div>
  <script src="/static/images.js"></script>
</body>
</html>
